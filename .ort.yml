        reason: INCORRECT
        comment: "False positive: matches the 'terms of use ... LICENSE' file header comment."

  # AUTHORS states the triple licence in prose; the scanner misparses
  # 'Apache License, Version 2.0, and the GNU Lesser General Public License' as
  # 'Apache-2.0 OR GPL-2.0-or-later'.
  - id: "Crate::r-efi"
    license_finding_curations:
      - path: "AUTHORS"
        detected_license: "Apache-2.0 OR GPL-2.0-or-later"
        concluded_license: "MIT OR Apache-2.0 OR LGPL-2.1-or-later"
        reason: INCORRECT
        comment: "False positive: the AUTHORS file states the triple licence MIT OR Apache-2.0 OR LGPL-2.1-or-later."
