    path_excludes:
      - pattern: "deny.toml"
        reason: BUILD_TOOL_OF
        comment: "cargo-deny config file; the word 'private' triggers a proprietary-license false positive."

  # Benchmark corpora: the Intel 80386 reference manual and a sampled OpenSubtitles
  # text are detected as a proprietary license. Only those findings are curated, so
  # the Project Gutenberg license detected in the Sherlock Holmes haystacks stays
  # part of the reported licenses and of the generated NOTICE.
  - id: "Crate::aho-corasick"
    license_finding_curations:
      - path: "benchmarks/haystacks/opensubtitles/en-sampled.txt"
        detected_license: "LicenseRef-scancode-proprietary-license"
        concluded_license: "NONE"
        reason: INCORRECT
        comment: "False positive: prose in a benchmark corpus, not a license of the crate."
  - id: "Crate::memchr"
    license_finding_curations:
      - path: "benchmarks/haystacks/sliceslice/i386.txt"
        detected_license: "LicenseRef-scancode-proprietary-license"
        concluded_license: "NONE"
        reason: INCORRECT
        comment: "False positive: copyright notice of the Intel 80386 reference manual in a benchmark corpus, not a license of the crate."

  # Shipped code, so the finding is curated rather than excluded. The file header
  # comment 'For terms of use, please see the file called LICENSE' is detected as a
  # proprietary license.
  - id: "Crate::icu_collections"
    license_finding_curations:
      - path: "components/locale_core/src/extensions/private/mod.rs"
        detected_license: "LicenseRef-scancode-proprietary-license"
        concluded_license: "Unicode-3.0"
        reason: INCORRECT
        comment: "False positive: matches the 'terms of use ... LICENSE' file header comment."
  - id: "Crate::icu_locale_core"
    license_finding_curations:
