analyzer:
  enabled_package_managers:
    - Cargo

# The scanner checks out the full upstream repository of each dependency instead of
# only the published crate, which surfaces license text in files that are never
# distributed. The entries below correct those false positives. Findings that live
# in shipped code are curated instead of excluded.
package_configurations:
  # cargo-deny configuration; "[licenses.private]" is detected as a proprietary
  # license. Not part of the published crates.
  - id: "Crate::anstream"
    path_excludes:
      - pattern: "deny.toml"
        reason: BUILD_TOOL_OF
        comment: "cargo-deny config file; the word 'private' triggers a proprietary-license false positive."
  - id: "Crate::anstyle"
    path_excludes:
      - pattern: "deny.toml"
        reason: BUILD_TOOL_OF
        comment: "cargo-deny config file; the word 'private' triggers a proprietary-license false positive."
  - id: "Crate::anstyle-query"
    path_excludes:
      - pattern: "deny.toml"
        reason: BUILD_TOOL_OF
        comment: "cargo-deny config file; the word 'private' triggers a proprietary-license false positive."
